name: Build, push and bump the tv3ws submodule in TV30

on:
  push:
    branches: [main]

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TV3WS (self)
        uses: actions/checkout@v4
        with:
          path: tv3ws

      - name: Checkout Infra (Dockerfile and extra contexts)
        uses: actions/checkout@v4
        with:
          repository: multisens/Infra
          token: ${{ secrets.TV30_REPO_TOKEN }}
          path: infra

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push tv30-tv3ws
        uses: docker/build-push-action@v5
        with:
          context: ./tv3ws
          file: ./infra/dockerfiles/tv3ws.Dockerfile
          build-contexts: |
            tv30-data=./infra/user-files-template
            tv30-scripts=./infra/dockerfiles
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tv30-tv3ws:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/tv30-tv3ws:latest

  bump:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TV30 (superproject)
        uses: actions/checkout@v4
        with:
          repository: multisens/TV30
          token: ${{ secrets.TV30_REPO_TOKEN }}
          submodules: false
          fetch-depth: 0

      - name: Update the tv3ws submodule pointer
        env:
          TV3WS_SHA: ${{ github.sha }}
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"

          CURRENT=$(git ls-tree HEAD tv3ws | awk '{print $3}')
          if [ "$CURRENT" = "$TV3WS_SHA" ]; then
            echo "Pointer already at $TV3WS_SHA, no changes"
            exit 0
          fi

          echo "Updating the tv3ws submodule pointer: $CURRENT -> $TV3WS_SHA"
          git update-index --cacheinfo 160000 "$TV3WS_SHA" tv3ws

          git commit -m "chore: bump submodule tv3ws to ${TV3WS_SHA:0:7}"

          for i in 1 2 3; do
            if git push origin main; then exit 0; fi
            git pull --rebase origin main
          done
          echo "Push failed after 3 attempts"
          exit 1
